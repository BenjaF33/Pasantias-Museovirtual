<main class="pagina-registro">
  <form class="formulario-registro" (ngSubmit)="registrar()">
    <header class="encabezado-formulario">
      <p class="sobrelinea-formulario">Museo Virtual de Cipolletti</p>
      <h1>Crear una cuenta</h1>
      <p>Regístrate para continuar en el Museo Virtual.</p>
    </header>

    <div class="campo">
      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        autocomplete="name"
        placeholder="Tu nombre"
        required
        [(ngModel)]="nombre"
      >
    </div>

    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="email"
        placeholder="nombre@ejemplo.com"
        required
        [(ngModel)]="email"
      >
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="new-password"
        placeholder="Crea una contraseña"
        required
        [(ngModel)]="clave"
      >
    </div>

    @if (error) {
      <p class="mensaje-error" role="alert">{{ error }}</p>
    }

    <button class="boton-registro" type="submit" [disabled]="cargando">
      {{ cargando ? 'Registrando...' : 'Registrarse' }}
    </button>

    <p class="enlace-inicio-sesion">
      ¿Ya tienes una cuenta?
      <a routerLink="/inicio-sesion">Inicia sesión</a>
    </p>
  </form>
</main>
