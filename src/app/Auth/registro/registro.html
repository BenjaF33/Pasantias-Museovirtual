<main class="pagina-registro">
  <form class="formulario-registro">
    <header class="encabezado-formulario">
      <h1>Crear una cuenta</h1>
      <p>Regístrate para continuar en el Museo Virtual.</p>
    </header>

    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="email"
        placeholder="nombre@ejemplo.com"
        required
      >
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="new-password"
        placeholder="Crea una contraseña"
        required
      >
    </div>

    <button type="button">Registrarse</button>

    <p class="enlace-inicio-sesion">
      ¿Ya tienes una cuenta?
      <a routerLink="/inicio-sesion">Inicia sesión</a>
    </p>
  </form>
</main>
