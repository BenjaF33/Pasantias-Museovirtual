<main class="pagina-inicio-sesion">
	<form class="formulario-inicio-sesion" (ngSubmit)="ingresar()">
		<header class="encabezado-formulario">
			<p class="sobrelinea-formulario">Museo Virtual de Cipolletti</p>
			<h1>Iniciar sesión</h1>
			<p>Ingresa a tu cuenta del Museo Virtual.</p>
		</header>

		<div class="campo">
			<label for="email">Correo electrónico</label>
			<input
				type="email"
				id="email"
				name="email"
				autocomplete="email"
				placeholder="nombre@ejemplo.com"
				required
				[(ngModel)]="email"
			>
		</div>

		<div class="campo">
			<label for="password">Contraseña</label>
			<input
				type="password"
				id="password"
				name="password"
				autocomplete="current-password"
				placeholder="Ingresa tu contraseña"
				required
				[(ngModel)]="clave"
			>
		</div>

		@if (error) {
			<p class="mensaje-error" role="alert">{{ error }}</p>
		}

		<button class="boton-inicio-sesion" type="submit" [disabled]="cargando">
			{{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
		</button>

		<p class="enlace-registro">
			¿Todavía no tienes una cuenta?
			<a routerLink="/registro">Regístrate</a>
		</p>
	</form>
</main>
