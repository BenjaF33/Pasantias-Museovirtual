<main class="pagina-inicio-sesion">
	<form class="formulario-inicio-sesion">
		<header class="encabezado-formulario">
			<h1>Iniciar sesión</h1>
			<p>Ingresa a tu cuenta del Museo Virtual.</p>
		</header>

		<div class="campo">
			<label for="email">Correo electrónico</label>
			<input
				type="email"
				id="email"
				name="email"
				autocomplete="email"
				placeholder="nombre@ejemplo.com"
				required
			>
		</div>

		<div class="campo">
			<label for="password">Contraseña</label>
			<input
				type="password"
				id="password"
				name="password"
				autocomplete="current-password"
				placeholder="Ingresa tu contraseña"
				required
			>
		</div>

		<button type="button">Iniciar sesión</button>

		<p class="enlace-registro">
			¿Todavía no tienes una cuenta?
			<a routerLink="/registro">Regístrate</a>
		</p>
	</form>
</main>
